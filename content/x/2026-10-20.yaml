    text: |-
      네이비+카멜 출근룩은 비율만 정하면 쉬워져요.
      7:3은 회의 날, 5:5는 평소, 3:7은 힘 빼는 금요일.
      비율별로 입는 법을 정리했어요 🧵
    thread:
      - |-
        ① 네이비 7 : 카멜 3
        네이비 셋업 안에 카멜 니트 한 장.
        얼굴 옆에 따뜻한 색이 오면 네이비가 덜 무거워 보여요.
        회의 있는 날에 맞아요.
      - |-
        ② 반반 5 : 5
        카멜 니트에 네이비 스커트.
        반반은 몸이 위아래로 나뉘어 보이기 쉬워요.
        니트 앞자락만 살짝 넣어 허리선을 올려 주세요.
      - |-
        ③ 네이비 3 : 카멜 7
        카멜 코트를 열고 안은 네이비로.
        코트 사이로 보이는 네이비가 세로선이 돼서 길어 보여요.
        힘을 빼고 싶은 금요일에 좋아요.
      - |-
        피하면 좋은 것도 있어요.
        · 검정 가방·구두: 네이비가 바래 보여요
        · 톤이 다른 카멜끼리: 탁해 보여요
        · 빨강·초록 같은 강한 색: 시선이 흩어져요
        소품은 브라운, 세 번째 색은 아이보리까지만.
