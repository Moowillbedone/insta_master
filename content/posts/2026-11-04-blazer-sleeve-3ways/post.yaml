caption: |
  블레이저 소매, 걷는 법 3가지

  손등까지 덮는 소매는 블레이저를 무거워 보이게 해요.
  소매 끝을 조금만 올려 손목을 드러내면 같은 옷도 한결 가벼워 보여요.

  ✔ 한 번 접기: 4cm 정도 납작하게 한 번. 손목뼈와 시계가 보여요
  ✔ 밀어 올리기(푸시업): 팔꿈치 아래에서 멈추면 주름이 자연스럽게 모여요
  ✔ 니트 소매 빼기: 블레이저 밖으로 2cm만. 손목에 밝은 색이 한 줄 생겨요
  ✔ 어깨가 각진 블레이저는 접기, 부드러운 블레이저는 밀어 올리기가 잘 맞아요
  ✔ 회의 들어가기 전엔 소매만 내리면 다시 단정해요

  저장해두고 내일 아침 출근 전에 해보세요.
  블레이저 자주 입는 동료에게 보내줘도 좋아요.
  다음 편은 '출근 15초 · 머플러 매는 법 3가지'예요.

