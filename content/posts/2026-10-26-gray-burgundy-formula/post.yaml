caption: |
  회색 출근룩엔 버건디 딱 한 곳

  회색만 입은 날이 밋밋하게 느껴진다면 깊은 레드를 한 곳에만 더해보세요.
  니트, 가방, 립 중 하나면 충분해요.

  ✔ 회색은 넓게, 버건디는 한 곳만
  ✔ 니트는 코트 안에 입으면 세로로 좁게 보여 과하지 않아요
  ✔ 가방은 면적이 작아 차분함은 그대로 두고 색만 더해요
  ✔ 옷이 전부 회색인 날은 립으로 얼굴에 색을 둬요
  ✔ 연회색과는 또렷하게, 차콜과는 깊게 어울려요

  저장해두고 회색 입는 날 꺼내보세요.
  다음 편은 '컬러 공식 03 · 아이보리+브라운'이에요.

