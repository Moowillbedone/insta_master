caption: |
  트렌치 벨트, 묶는 위치만 바꿔도 실루엣 3가지

  같은 트렌치도 벨트를 어디서 묶느냐에 따라 선이 달라져요.

  ✔ 뒤로 묶기: 앞은 열어 세로선을 길게, 뒤쪽만 허리를 잡아요
  ✔ 한쪽 매듭: 허리가 잡히고, 매듭이 옆으로 가서 앞이 깔끔해요
  ✔ 풀어서 주머니: 조이는 곳 없이 일자로 떨어지고 벨트 끝이 덜렁이지 않아요
  ✔ 리본보다 매듭 한 번이 끝이 깔끔하게 떨어져요

  저장해두고 내일 아침 거울 앞에서 따라 해보세요.
  트렌치 꺼낸 동료에게 보내줘도 좋아요.
  금요일엔 이 트렌치 하나로 날씨별 3가지를 올려요.
  다음 출근 15초는 '니트 넣어 입기 3가지'예요.

