caption: |
  차콜 울 코트 하나로 3가지 출근룩

  코트를 하나 더 사기 전에, 한 벌을 세 번 쓰는 법이에요.
  코트는 그대로 두고 안쪽만 바꿔요.

  ✔ 포멀: 연회색 니트 + 차콜 슬랙스, 톤온톤으로 단정하게
