  ✔ 캐주얼: 후드는 깃 밖으로 꺼내야 등이 불룩하지 않아요
  ✔ 돌려 입을 코트는 니트·후드가 들어가는 어깨 여유부터 확인해요

  입동 무렵부터는 코트 입는 날이 늘어요.
  저장해두고 다음 주에 하나씩 돌려 입어보세요.
