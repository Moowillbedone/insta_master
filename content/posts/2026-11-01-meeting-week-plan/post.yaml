caption: |
  회의 많은 주, 일정별 출근룩 플랜

  다음 주 일정표를 먼저 보고 날마다 옷을 정해요.
  발표·외근이 없는 날은 '평소' 룩을 돌려 입어요.

  ✔ 발표날: 어두운 상의 + 어깨선 있는 재킷 → 차분하고 믿음직해 보여요
  ✔ 외근날: 굽 낮은 신발 + 크로스백 → 오래 걸어도 편하고 두 손이 자유로워요
  ✔ 평소: 카디건 한 장 → 회의실 온도에 맞춰 입고 벗기 쉬워요
  ✔ 금요일: 밝은 데님 + 진한 니트 → 가벼워도 단정해요 (외근날 하프코트를 한 번 더)

  일요일 밤에 저장해두고 아침마다 꺼내보세요.
  회의 많은 동료에게 보내줘도 좋아요.
  다음 편은 '다음 주 플랜 · 입동 주간'이에요.

