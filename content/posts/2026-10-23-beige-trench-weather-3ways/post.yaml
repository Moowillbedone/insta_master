caption: |
  베이지 트렌치 하나로 날씨별 3가지 🧥
  트렌치코트 출근룩 코디 3가지, 맑은 날·쌀쌀한 날·비 오는 날로 나눴어요.

  트렌치는 그대로 두고, 안에 입는 옷과 여밈만 바꿔요.
  기준은 출근 시간 기온과 비 예보 두 가지예요.

  ✔ 맑음 18°C: 셔츠 한 장에 앞을 열어 세로선을 길게
  ✔ 쌀쌀한 12°C 아침: 하이넥 니트로 목까지 덮기
  ✔ 비 오는 날: 짙은 발목 기장 하의로 밑단 젖음과 물 자국 줄이기
  ✔ 10°C 아래로 내려가면 트렌치보다 코트가 맞아요
  ✔ 벨트는 리본보다 매듭 한 번이 단정해요

  저장해두고 아침에 날씨 앱과 같이 보세요.
  트렌치 고민하는 동료에게 보내줘도 좋아요.
  벨트 묶는 법은 수요일 '출근 15초'에 있어요.
  다음 편은 '한 벌 3가지 · 회색 니트 하나로 3가지'예요.

