caption: |
  퇴근 후 약속, 옷 안 갈아입어도 돼요
  퇴근 후 약속룩 코디, 출근룩에서 저녁룩으로 바꾸는 법이에요.

  출근룩은 그대로 두고 네 가지만 바꾸면 저녁 모드가 돼요.

  ✔ 귀걸이: 작은 링 → 드롭형, 얼굴 옆이 반짝여요
  ✔ 립: 한 톤 진하게, 저녁 조명에서도 또렷해요
  ✔ 재킷: 벗어서 의자에, 어깨 각이 빠져 부드러워요
  ✔ 벨트: 얇은 벨트 하나로 허리선이 또렷해져요

  드롭 귀걸이·립·벨트는 아침에 가방에 넣어 두세요.
  저장해두고 약속 있는 날 꺼내보세요.
  같이 약속 가는 동료에게 보내줘도 좋아요.
  다음 출근 15초는 '머플러 매는 법 3가지'예요.

