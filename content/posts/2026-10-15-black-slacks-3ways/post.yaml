caption: |
  검은 슬랙스 하나로 3일 출근룩 🖤
  검은 와이드 슬랙스 출근룩 코디 3가지, 요일별로 정리했어요.

  하의는 그대로 두고 상의 밝기만 바꿨어요.
  월요일은 아이보리 니트로 부드럽게,
  수요일은 옥스퍼드 셔츠로 가볍게,
  금요일은 차콜 블레이저로 단단하게.

  ✔ 밝은 상의는 넣어 입어서 허리선을 올려요
  ✔ 셔츠 소매는 두 번 접으면 덜 딱딱해 보여요
  ✔ 어두운 톤을 위아래로 이으면 길어 보여요

  저장해두고 다음 주 출근 전에 꺼내보세요.
  검은 슬랙스 자주 입는 동료에게 보내줘도 좋아요.
  다음 편은 '베이지 트렌치 하나로 날씨별 3가지'예요.

