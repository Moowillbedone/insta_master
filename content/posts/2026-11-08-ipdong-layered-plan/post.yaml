caption: |
  입동 주간 3겹 레이어드 플랜
  초겨울 출근룩 레이어드 코디, 상황별로 정리했어요.

  출근길은 춥고 사무실은 더운 계절이 왔어요.
  다음 주는 두꺼운 한 벌 대신 얇게 세 겹으로 입어요.
  아침엔 따뜻하게, 난방 켜진 사무실에선 한 겹씩 벗기 쉽게요.

  ✔ 추운 아침: 터틀넥 + 카디건 + 카멜 코트
  ✔ 난방 센 날: 셔츠 + 니트 조끼 + 차콜 코트
  ✔ 미팅 있는 날: 셔츠 + 얇은 니트, 깃은 밖으로
  ✔ 금요일: 긴소매 티 + 니트 집업 + 퀼팅 재킷
  ✔ 벗는 순서는 코트 → 니트, 이너는 끝까지 입으니 단정한 걸로

  일요일 밤에 저장해두고 아침마다 꺼내보세요.
  사무실 난방에 옷 고민하는 동료에게 보내줘도 좋아요.
  다음 주 플랜은 '연말 약속 많은 주'예요.

