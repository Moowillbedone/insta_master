caption: |
  일교차 10도 주간, 옷 8벌로 월~금 출근룩

  아침 8°C, 낮 18°C처럼 일교차가 10도쯤 벌어지는 주에 맞춘 플랜이에요.
  옷 8벌과 신발 2켤레로 5일을 돌려 입어요. 이번 주 예보와 같이 확인해보세요.

  ✔ 월: 셔츠 칼라를 니트 밖으로 꺼내 얼굴 쪽을 밝게
  ✔ 화: 카디건 단추를 다 잠가 니트 상의처럼 (네이비+카멜 공식)
  ✔ 수: 트렌치 벨트를 한쪽 매듭으로 묶어 허리 잡기
  ✔ 목: 출근길엔 카디건을 입고, 실내에선 어깨에 걸치기
  ✔ 금: 스트라이프 티 위에 셔츠를 열어 걸쳐 한 겹 더하기

  규칙은 하나예요. 얇게 여러 겹 입고, 낮엔 바깥부터 한 겹씩 벗기.
  저장해두고 일요일 밤에 옷을 미리 꺼내두세요.
  다음 편은 '다음 주 플랜 · 회의 많은 주'예요.

