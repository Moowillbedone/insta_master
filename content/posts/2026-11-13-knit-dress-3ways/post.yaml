# 한 벌 3가지 05. 이전 편: 차콜 울 코트 하나로 3가지 (11/6). 다음 편: 한 벌 3가지 · 와이드 데님 하나로 3가지
# WEEK 4 (11/9–11/15) 연말 준비·세일 시즌 · 금요일 카드뉴스 + 릴스
# 모든 사진에서 같은 초콜릿 브라운 골지 니트 원피스(종아리 중간 길이)를 입고, 한 겹(블레이저 / 롱코트+부츠 / 셔츠)만 바꾼다
# 이 원피스는 11/15 주간 플랜 목요일 룩에서 다시 쓴다. 이미지마다 원피스 영문 묘사를 글자 그대로 복사한다 (the same 만으로는 생성할 때 이어지지 않음)
# 11월 중순이라 맨다리는 피한다: 로퍼·스니커즈 룩은 브라운 불투명 타이츠, 롱부츠 룩은 부츠 목이 밑단 안으로
# 셔츠 레이어드는 얇은 포플린 (옥스퍼드는 두꺼워 니트 겉으로 주름이 드러남 — TIP 슬라이드와 일치)
