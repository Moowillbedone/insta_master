caption: |
  니트 넣는 법, 바지마다 달라요
  니트 넣어 입는 법, 슬랙스 종류별 출근룩 코디예요.

  같은 니트도 어떻게 넣느냐에 따라 허리선과 실루엣이 달라져요.

  ✔ 와이드 슬랙스 → 앞만 넣기: 허리선이 보여 다리는 길어 보이고, 뒤는 편해요
  ✔ 일자 슬랙스 → 다 넣고 살짝 빼기: 위에 여유가 생겨 곧은 바지와 균형이 맞아요
  ✔ 핀턱 슬랙스 → 벨트로 잡기: 주름이 허리부터 곧게 떨어져요
  ✔ 두꺼운 니트는 앞만, 얇은 니트는 전체: 그래야 허리가 뭉치지 않아요

  저장해두고 내일 입을 바지에 맞춰보세요.
  니트 자주 입는 동료에게 보내줘도 좋아요.
  다음 편은 '출근 15초 · 블레이저 소매 걷는 법'이에요.

