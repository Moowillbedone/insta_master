# 주간 출근룩 플랜 04 (11/16–11/20 주를 위한 플랜). 이전 편: 입동 주간 (11/8). 다음 편: 다음 주 플랜 · 첫 추위 주간
# WEEK 4 (11/9–11/15) 연말 준비·세일 시즌 · 일요일 저녁 게시
# 요일마다 저녁 약속 하나: 월 회식 · 화 친구 저녁 · 수 격식 자리 · 목 동기 모임 · 금 송년회
# 아침 옷은 그대로, 저녁엔 '하나만' 바꾸는 규칙. 수요일 릴스(11/11)의 도구를 요일에 하나씩 나눠 쓴다:
#   월 바꿀 것 없음(처음부터 편한 하의) · 화 카디건 벗기(=재킷 벗기) · 수 립 · 목 벨트 · 금 드롭 귀걸이
# 목요일 니트 원피스는 11/13 한 벌 3가지와 같은 원피스, 차콜 코트는 11/6과 같은 코트 (영문 묘사를 글자 그대로 복사)
# 겉옷은 주 전반 카멜 하프코트, 후반 차콜 울 코트로 돌려 입는다
# 페르소나 기본값(작은 금 허기 귀걸이·로지 베이지 립)이 자동으로 붙으므로, 바꾼 장면에만 'instead of'를 적는다
