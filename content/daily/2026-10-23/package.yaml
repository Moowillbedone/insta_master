  why_now: '11/1(일) 구매분부터 병용 기간 없이 바로 바뀝니다(D-9). 아시아경제 10/22(https://view.asiae.co.kr/article/2026102218261278352)와 노컷뉴스(https://nocutnews.co.kr/news/6595728)가 시행 직전에 보도했고, 일본 공항 운영사 공식 한국어 안내(https://www.centrair.jp/ko/taxrefund/, ''2026년 11월 1일 개정'')와 MATCHA 한국어 절차 정리(https://matcha-jp.com/ko/27460)가 있습니다. 오늘이나 내일 바로 쓸 수 있는 예비 주제이고, 늦어도 10/28까지 올려야 합니다. 일본 국세청(nta.go.jp) 리펀드 방식 특설 사이트 원문 URL을 아직 확보하지 못해, 사실 확인 단계에서 90일 기한·5,000엔 최소액·50만 엔 상한 폐지·환급 수단을 원문으로 확인해야 합니다. 아시아투데이 10/21 카드뉴스와 구성·문장이 겹치지 않게 써야 합니다(점수: 시의성5 저장5 대상4 그림3 확인4 − 위험1). info-clean.'
