  visual: 10월 말 해 질 무렵, 집 안 나무 식탁 위에 차린 따뜻한 한식 집밥 상차림을 눈높이보다 조금 높은 곳에서 비스듬히 내려다본 장면을 화면 전체에 깐다. 김이 살짝 오르는 된장찌개가 담긴 무지 뚝배기, 윤기 도는 흰 쌀밥이 담긴 무지 도자기 밥공기, 나물·김치·달걀말이가 담긴 작은 무지 반찬 그릇 몇 개, 나무 수저 한 벌이 놓여 있고, 식탁 모서리에 노랗게 물든 은행잎 한 장이 떨어져 있다. 옆 창으로 낮게 들어온 노을빛이 상차림을 옆에서 비추고, 찌개의 김이 빛을 받아 은은하게 보인다. 실제 카메라로 찍은 듯한 자연광과 뚝배기·도자기·나무 결의 생활감 있는 질감, 과한 보정·광택·CG 느낌 없음. 사람 없음. 위쪽은 차분하게 어두워진 짙은 갈색 나무 벽면이 부드럽게 흐려지도록 단순하게 비워 두어, 큰 흰 제목 2줄·노란 하이라이트 밑줄과 그 바로 아래 흰 작은 글씨 한 줄이 또렷하게 읽히게 한다. 간판·로고·상표·그릇 글씨 없음, 모든 그릇은 무지.
