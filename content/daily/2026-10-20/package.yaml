  - 북한산(출처마다 10/28~11/4)·화악산(10/20 vs 10/23) 날짜는 넣지 않았습니다. 국립수목원 참나무류 11/2는 휴원일(월요일)이라 쓰지 않았습니다.
  - 뉴스1 '5만 4천 명'(f28)은 원문 미확인이라 카드·캡션에 쓰지 않았습니다. 인파 수치(f27)도 트렌드 근거로만 쓰고, 인파 기사에 섞인 산악사고 내용은 레드라인이라 다루지 않습니다.
  - 한라산 예약 인원(f21)은 작년 기준이라 5장에 '(작년 기준)'만 붙이고 인원 숫자는 쓰지 않았습니다. 입장료·관람료(f29)도 작년 기준이라 요금 표기를 넣지 않았습니다.
