- title: '이번 주말(10/24~25) 서울 축제·가을 나들이 5곳 (후보 #1과 #12 합침)'
  category: 축제
  score_total: 21
  why_now: '서울바비큐페스티벌(10/24~25 난지캠핑장, 10/19 개막 보도), 한강페스티벌 가을(~10/25), 서울디자인위크(~10/25), 서울펫림픽(10/24~25), 서울국제정원박람회 매헌시민의숲(~10/27)이 한 주말에 겹치고, 여러 곳이 이번 주말에 끝납니다. 서울시 공식 URL이 가장 많은 후보입니다(news.seoul.go.kr/culture/archives/534476, culture.seoul.go.kr cultcode=159406, news.seoul.go.kr/env/archives/571090, mediahub.seoul.go.kr/archives/2019559, seoul.go.kr/festa/garden/y2026). 단풍이 사실 확인에서 막히면 오늘 쓸 1순위 예비이고, 아니면 내일(10/21)이나 모레 주제로 쓰는 게 더 좋습니다. 주의할 점이 있습니다. 재검색해 보니 티켓 사이트는 바비큐페스티벌을 ''유료''로, 펀서울은 디자인위크를 ''15,000원~''으로 표시합니다. 그래서 ''무료'' 훅은 빼고, 장마다 입장료를 공식 출처 기준으로 따로 적어야 합니다. 셀프BBQ존은 예약 마감이고, 펫림픽 장소는 공식 보도 기준 월드컵공원 평화광장입니다(다른 목록의 올림픽공원은 틀림). 한성백제 드론쇼와 도곡 페스타는 빼고 쓰기를 권합니다. info-warm. (점수: 시의성5 저장5 대상5 그림4 확인4 − 위험2)'
- title: '매주 수요일은 문화요일: 10/28 영화 할인 + 국공립 혜택 (옛 기준 정정형)'
  category: 혜택
  score_total: 21
  why_now: '내일(10/21)이 수요일이고, 2026년 4월부터 ''문화가 있는 날''이 매주 수요일로 넓어졌다는 공식 근거가 있습니다(문체부 https://www.mcst.go.kr/site/s_notice/news/newsView.jsp?pSeq=5867, 4/1). 그런데 정부24 안내는 아직 옛 기준(마지막 수요일·7천원)이어서, ''헷갈리지 마세요'' 정정형으로 저장·공유가 잘 됩니다. 시즌·축제와 다른 분야여서 분야를 나눠 쓰기에도 좋습니다. 10/28 영화 할인 시간·가격(오후 5~9시, 1만원/8천원)은 블로그에만 있어 극장 공지로 confirmed로 만들어야 하고, 월 2회 할인 시작 달은 출처마다 4월/5월로 다릅니다. 그림 요소가 약하니 info-clean을 씁니다. (점수: 시의성4 저장5 대상5 그림3 확인4 − 위험0) 참고로 서울억새축제(~10/23, 20점, info-night)는 근소하게 밀렸습니다. 남은 기간이 3일뿐이라 저장 가치가 짧고, 10/22 아침 4도 추위 예보가 겹쳐 야간 방문 수요도 줄어듭니다. 오늘 안에 단풍과 주말 목록이 모두 막히면 그때 쓸 수 있습니다.'
