caption: |
  스타벅스 겨울 시즌 오늘(10/22) 시작, 대상 푸드 20% 할인은 10/25(일)까지
  스타벅스 겨울 시즌 · 토피 넛 라떼 · 크리스마스 디저트 · 겨울 e-프리퀀시

  ✔ 시즌 음료 4종 중 신제품은 살구 조이풀 메들리 티 라떼 하나 (여름 '살구 조이풀 메들리 쉐이큰 티'의 겨울 버전)
  ✔ 토피 넛 라떼·윈터 스카치 바닐라 라떼·클래식 뱅쇼 히비스커스 티(논알코올)는 다시 나온 메뉴
  ✔ 토피 넛 라떼는 2002년 첫 출시, 누적 판매 4000만 잔 이상
  ✔ 크리스마스 디저트: 누텔라 촉촉 생크림 케이크, 누텔라 바게트 소금빵, 루돌프 쿠키 치즈 케이크, 산타 레드벨벳 치즈 케이크, 트리 말차 크런치 케이크, 스노우맨 마카롱 등
  ✔ 비프 멜트 바게트 샌드위치도 다시 나와요
  ✔ 대상 푸드 7종 20% 할인 10/22(목)~10/25(일) · 대상 7종 목록은 앱·매장에서 확인하세요
  ✔ 그린·골드 회원은 시즌 음료 구매 시 별 최대 3개 추가 적립, 10/28(수)까지
  ✔ 겨울 e-프리퀀시 10/22~12/31 · 미션 3잔 포함 17잔 · 10/22~25에 플래너를 받으면 추가 증정 (한정 수량 선착순)
  ✔ 굿즈는 10/22부터 차례로 출시 · 가격은 앱·매장에서 확인하세요

  저장해 두고, 같이 갈 친구에게 보내 주세요.
  정보는 10월 22일 기준이에요.
