caption: |
  억새축제는 이번 금요일(10/23)이 마지막, 이번 주 끝나는 서울 무료 나들이 3곳
  서울억새축제 · 한강페스티벌 · 서울디자인위크 · 서울 주말 가볼만한곳

  ✔ 억새축제(마포 하늘공원) 10/23(금)까지 · 입장 무료
  ✔ 10:00~21:00, 라이팅쇼 19시부터 30분 간격(예정) · 맹꽁이 전기차는 19시께 끝나요(현장 확인)
  ✔ 토·일엔 억새축제 프로그램이 없어요 (축제 뒤 연장 개방은 아직 공지 전)
  ✔ 한강페스티벌 가을 10/25(일)까지 · 공연·쉼터 무료, 음식·일부 프로그램 유료
  ✔ 뚝섬 청년 셰프 푸드트럭 금~일 · 강서 어린이 짚라인 토·일 13~17시
  ✔ 서울디자인위크 10/25(일)까지 · 어울림광장·디자인둘레길 무료(11:00~20:00)
  ✔ DDP 야외 디자인마켓 2차 10/23~25 · 유료 디자인페어는 끝났어요

  저장해 두고, 같이 갈 친구에게 보내 주세요.
  정보는 10월 21일 기준이에요.
