  visual: 해 질 무렵 완만한 언덕 위로 은빛 억새밭이 넓게 펼쳐진 풍경을 화면 전체에 깐다. 역광을 받은 억새 이삭이 반짝이고, 멀리 강과 도시 건물 윤곽이 옅은 노을빛 안개 속에 흐릿하게 보인다. 억새 사이 흙길에 아주 작은 뒷모습 실루엣 2명. 실제 카메라로 찍은 듯한 자연광과 억새의 거친 질감, 과한 보정·광택 없음. 위쪽 하늘은 해가 막 진 뒤의 차분한 주황~짙은 청색 그라데이션으로 단순하게 두어, 큰 흰 제목 2줄·노란 하이라이트 밑줄과 그 바로 아래 흰 작은 글씨 한 줄이 또렷하게 읽히게 한다. 표지판·글씨·로고 없음.
