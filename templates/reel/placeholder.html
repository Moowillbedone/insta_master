<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
{{ fonts_css() | safe }}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: {{ W }}px; height: {{ H }}px; overflow: hidden; }
body { position: relative; background: {{ paper }}; -webkit-font-smoothing: antialiased; word-break: keep-all; font-variant-numeric: lining-nums; }
/* 사진이 생기기 전 레이아웃 검토용 자리표시. 의도된 화면처럼 보이도록 따뜻한 무채색 + 얇은 테두리 */
.ph {
  position: absolute; left: {{ rect.x }}px; top: {{ rect.y }}px; width: {{ rect.w }}px; height: {{ rect.h }}px;
  overflow: hidden;
  background:
    radial-gradient(80% 55% at 50% 40%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 72%),
    linear-gradient(168deg, {{ tone[0] }} 0%, {{ tone[1] }} 55%, {{ tone[2] }} 100%);
}
.frame { position: absolute; inset: {{ inset }}px; border: 2px solid rgba(255,255,255,.55); }
.corner { position: absolute; width: 36px; height: 36px; border-color: rgba(70,58,46,.45); border-style: solid; border-width: 0; }
.corner.tl { left: {{ inset - 18 }}px; top: {{ inset - 18 }}px; border-left-width: 2px; border-top-width: 2px; }
.corner.tr { right: {{ inset - 18 }}px; top: {{ inset - 18 }}px; border-right-width: 2px; border-top-width: 2px; }
.corner.bl { left: {{ inset - 18 }}px; bottom: {{ inset - 18 }}px; border-left-width: 2px; border-bottom-width: 2px; }
.corner.br { right: {{ inset - 18 }}px; bottom: {{ inset - 18 }}px; border-right-width: 2px; border-bottom-width: 2px; }
.mid {
  position: absolute; left: 50%; top: {{ label_y }}px; transform: translate(-50%, -50%);
  width: {{ [rect.w - 2 * inset - 80, 760] | min }}px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px;
  color: rgba(62,52,42,.82);
}
.icon { width: 64px; height: 64px; opacity: .7; }
.tag { font-family: 'Pretendard'; font-weight: 600; font-size: 26px; letter-spacing: .28em; white-space: nowrap; }
.tag .key { font-family: 'Cormorant Garamond'; font-weight: 600; font-size: 34px; letter-spacing: .08em; margin: 0 .2em; }
.rule { width: 48px; height: 1px; background: rgba(62,52,42,.45); }
.prompt { font-family: 'Cormorant Garamond'; font-weight: 500; font-size: 36px; line-height: 1.3; color: rgba(62,52,42,.72); }
.note { font-family: 'Pretendard'; font-weight: 500; font-size: 22px; letter-spacing: .02em; color: rgba(62,52,42,.6); }
</style>
</head>
<body>
<div class="ph">
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
</div>
<div class="mid">
  <svg class="icon" viewBox="0 0 64 64" fill="none" stroke="rgb(62,52,42)" stroke-width="1.6">
    <rect x="8" y="18" width="48" height="34" rx="3"/><path d="M22 18l4-6h12l4 6"/><circle cx="32" cy="35" r="10"/><circle cx="32" cy="35" r="4"/>
  </svg>
  <div class="tag">PHOTO<span class="key">{{ key }}</span>· {{ framing }}</div>
  <div class="rule"></div>
  {% if prompt %}<div class="prompt">“{{ prompt }}”</div>{% endif %}
  <div class="note">사진 준비 전 · 레이아웃 확인용</div>
</div>
</body>
</html>
