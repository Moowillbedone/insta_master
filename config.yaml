# 도하 운영 키트 전역 설정
# 경로는 저장소 루트 기준입니다.

account:
  handle: doha.dailyfit
  display_name: "도하 | AI 스타일리스트"
  url: https://www.instagram.com/doha.dailyfit/
  goal_monthly_net_krw: 5000000   # 목표치이지 예상 수익이 아님

paths:
  posts: content/posts
  persona: brand/doha.yaml
  reference_images: brand/reference
  fonts: assets/fonts
  templates: templates
  tracking: tracking
  outreach: outreach

canvas:
  # 피드 카드뉴스. 2025년 프로필 그리드가 3:4로 바뀐 뒤 1080x1440 업로드가 잘리지 않음.
  # 앱에서 잘림이 보이면 4:5(1080x1350)로 바꾸세요.
  carousel: { width: 1080, height: 1440 }
  carousel_fallback: { width: 1080, height: 1350 }
  # 릴스 9:16
  reel: { width: 1080, height: 1920, fps: 30 }
  # 릴스 화면 UI(상단 바, 하단 캡션·버튼, 오른쪽 아이콘)에 가리지 않는 안전 영역 (px)
  reel_safe: { top: 220, bottom: 420, left: 60, right: 140 }

image_generation:
  provider: openai
  model: gpt-image-2
  size: 1024x1536          # 세로
  quality: medium          # low | medium | high — 시안은 medium, 확정컷만 high
  # 장당 예상 비용 (USD). 실행 전 상한 계산용이라 실제보다 약간 높게 잡음.
  # 공개 자료 기준 gpt-image-2 1024x1536 출력 비용: low ≈ 0.005 / medium ≈ 0.041 / high ≈ 0.165 [보도]
  # 참조 이미지(얼굴 기준) 입력 토큰은 별도 — research/image-gen-tech.md §1
  est_cost_usd:
    low: 0.02
    medium: 0.05
    high: 0.17
  # 응답의 토큰 사용량으로 실제 금액을 계산해 tracking/costs.csv 에 기록 (100만 토큰당 USD).
  # 2026-10 공개 자료 기준 값 [보도]. 결제 전에 OpenAI 가격 페이지에서 한 번 확인하세요.
  token_prices_usd_per_1m:
    text_input: 5
    image_input: 8
    image_output: 30
  # 3:4 원본이 필요하면 size: 1152x1536 을 1장만 먼저 시험 (gpt-image-2 는 16의 배수 자유 크기 지원 [보도]).
  # 비교 후보 모델: gpt-image-2.5-sunburst (정밀 편집, 2026-09 출시 [보도]) — 같은 프롬프트 10장으로 비교 후 결정
  max_cost_per_run_usd: 1.00
  require_confirmation: true   # 비용 발생 전 터미널에서 y 입력 필요

fx:
  usd_krw: 1400   # 비용 환산용 환율. 실제 결제 환율로 가끔 갱신

publishing:
  default_time: "07:40"      # 출근길 확인 시간대 (가설 — 성과 데이터로 조정)
  timezone: Asia/Seoul
  max_hashtags: 5
