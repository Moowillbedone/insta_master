# 정보형 카드뉴스(매일 패키지) 스타일 프리셋 — ChatGPT 이미지 프롬프트의 '공통 스타일' 문단으로 그대로 들어갑니다.
# 같은 계정은 같은 프리셋을 꾸준히 써야 피드가 한 계정처럼 보입니다. 주제에 따라 아래 셋 중 하나만 고릅니다.
# 공통 원칙은 common_rules 에 있고, 모든 프롬프트 끝에 자동으로 붙습니다 (doha/daily.py).

canvas:
  ratio: "세로 3:4"
  size: "1080x1440"
  safe_margin: "가장자리 80px 안쪽에만 글자 배치 (피드에서 4:5로 잘려도 글자가 남도록 위·아래 90px 여백)"

common_rules:
  - "이미지 안의 글자는 아래에 따옴표로 준 문구만, 띄어쓰기·숫자·기호까지 정확히 그대로 넣는다. 다른 글자·영어·장식 문구를 추가하지 않는다."
  - "한글은 굵고 또렷한 고딕체로, 한 줄은 짧게. 글자가 깨지거나 잘리면 다시 그린다."
  - "실존 브랜드 로고, 워터마크, 간판 글씨, 실존 인물의 얼굴, 캐릭터(IP)는 그리지 않는다."
  - "실제 장소를 사진처럼 표현할 때는 오른쪽 아래 구석에 아주 작게 'AI 생성 이미지'라고 넣는다."
  - "모든 장은 같은 색·같은 글꼴 느낌·같은 배치 규칙을 유지해 한 시리즈처럼 보이게 한다."

presets:
  info-warm:
    when: "핫플·팝업·축제·전시·맛집·신상 등 장소·행사 소개 (기본값)"
    style: >-
      따뜻한 크림색(#F6EFE4) 배경 위에 모서리가 둥근(반경 48px) 큰 사진 타일 1장을 화면 위쪽 65%에 배치한다.
      사진 타일 아래쪽 가장자리에 걸치도록 흰색 말풍선 라벨(검은 굵은 고딕 제목, 양옆에 작은 노란 반짝이 ✦)을 둔다.
      그 아래 크림색 영역에 작은 아이콘(달력·핀·지갑) + 한 줄 정보 2~3줄을 진한 갈색(#3B2A20)으로 정렬한다.
      사진은 밝고 선명한 실사풍, 따뜻한 색감, 사람은 작게 뒷모습이나 실루엣으로만.
      표지(1장)는 사진을 화면 전체에 깔고, 위쪽에 큰 흰 제목 2줄과 노란 하이라이트 밑줄을 넣는다.
  info-night:
    when: "야경·조명 축제·연말 행사·공연 등 밤이 주인공일 때"
    style: >-
      짙은 남색(#0E1630) 배경, 금색(#F5C46B) 포인트. 모서리가 둥근 사진 타일(밤 풍경, 반짝이는 조명, 보케)을 위쪽 65%에 둔다.
      제목은 흰색 굵은 고딕, 금색 얇은 테두리의 둥근 라벨 안에. 정보줄은 연한 회색(#D8DCE8) 작은 글씨와 금색 아이콘.
      표지는 밤 풍경을 전체에 깔고 큰 흰 제목 2줄, 금색 반짝이 몇 개.
  info-clean:
    when: "혜택·지원금·꿀팁·체크리스트·비교처럼 정보가 주인공일 때"
    style: >-
      흰 배경(#FFFFFF), 포인트색 선명한 초록(#16A34A)과 노랑 하이라이트(#FDE68A).
      위쪽에 큰 번호(01, 02…)와 굵은 제목, 아래에 체크 아이콘이 있는 짧은 문장 2~4줄을 카드 형태(연회색 둥근 상자)로 배치한다.
      사진 대신 단순한 평면 아이콘 일러스트 1개를 오른쪽 위에 작게. 표지는 큰 제목 2줄 + 노란 형광펜 밑줄 + 아이콘 1개.

slide_plan:
  min: 5
  max: 8
  roles:
    cover: "표지: 훅 제목(2줄 이내) + 작은 부제 1줄. 저장·공유하고 싶게."
    item: "항목 1개 = 1장. 제목 + 정보줄 2~3개(날짜·장소·가격 등) + 한 줄 포인트."
    summary: "한눈에 정리 또는 비교표."
    tip: "가기 전/신청 전 체크 3~5개."
    cta: "마지막 장: '저장하고 친구에게 보내기' + 정보 기준일·변경 가능 안내."
